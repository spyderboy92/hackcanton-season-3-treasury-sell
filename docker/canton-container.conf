# Container overlay for the sandbox: bind addresses and storage.
#
# The SDK's own sandbox.conf gives the participant, sequencer and mediator
# `storage.type = memory`. That is right on a laptop and wrong in a container:
# the compose stack keeps ledger state in a named volume, so `docker compose
# down` must not lose it and only `down -v` should.
#
# Canton merges `-c` files left to right, so this is layered on top of the
# stock sandbox.conf and restates nothing but storage. Ports, node names and
# the node set all still come from the SDK's own file.
#
# H2 file mode, not Postgres: the point is a single self-contained service, and
# the open-source sandbox supports H2 directly. Note the inner reference
# sequencer driver wants the kebab-cased `h-2` hint while the node-level
# configs want `h2` — the two configs are parsed by different coproduct hints,
# and `h2` in the driver block fails with "Failed to parse sequencer driver
# config of type reference".

canton {
  # Canton binds its APIs to 127.0.0.1 by default. Inside a container that is
  # the container's own loopback, so a published port forwards to nothing and
  # the frontend container cannot reach the participant either — the healthcheck
  # passes (it curls from inside) while every client outside fails.
  participants.sandbox.ledger-api.address = "0.0.0.0"
  participants.sandbox.http-ledger-api.address = "0.0.0.0"

  participants.sandbox.storage = {
    type = h2
    config {
      driver = org.h2.Driver
      url = "jdbc:h2:file:///var/lib/canton/participant;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
      user = "sa"
      password = ""
    }
  }

  sequencers.sequencer1.storage = {
    type = h2
    config {
      driver = org.h2.Driver
      url = "jdbc:h2:file:///var/lib/canton/sequencer;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
      user = "sa"
      password = ""
    }
  }

  sequencers.sequencer1.sequencer.config.storage = {
    type = h-2
    config {
      driver = org.h2.Driver
      url = "jdbc:h2:file:///var/lib/canton/sequencer-driver;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
      user = "sa"
      password = ""
    }
  }

  mediators.mediator1.storage = {
    type = h2
    config {
      driver = org.h2.Driver
      url = "jdbc:h2:file:///var/lib/canton/mediator;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1"
      user = "sa"
      password = ""
    }
  }
}
