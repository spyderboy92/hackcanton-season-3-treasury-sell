# One command: `docker compose up`.
#
# Builds the DAR, starts a Canton sandbox, seeds the demo scenario, serves the
# UI against the live ledger. Nothing to install on the host but Docker.
#
#   http://localhost:3000   the app, wired to the live ledger
#   localhost:6864          Canton JSON Ledger API v2
#   localhost:6865          Canton gRPC Ledger API
#
# Every published port is bound to 127.0.0.1: the ledger API is UNAUTHENTICATED,
# so the stack must not be reachable from off the machine. See the note on the
# canton service below.
#
#   docker compose run --rm tests              the Daml suite
#   docker compose --profile tunnel up         app + Cloudflare Tunnel (UI only)
#   docker compose down                        stop, keep ledger state
#   docker compose down -v                     stop, wipe ledger state

name: treasury-rfq

services:
  # Toolchain, DAR, sandbox and seed. `healthy` here means the JSON Ledger API
  # answers AND Demo.Bootstrap has run — see docker/canton-healthcheck.sh.
  canton:
    build:
      context: .
      dockerfile: Dockerfile.canton
      target: runtime
    image: treasury-rfq-canton
    # Bound to LOOPBACK, deliberately. The sandbox serves the Ledger API with no
    # authentication at all: the acting party is whatever the caller names, so
    # anyone who can reach these ports can read any desk's ACS and submit as any
    # party. That is fine for a demo on one machine and is not a deployment
    # posture — publishing them on 0.0.0.0 would put the privacy model this
    # project exists to demonstrate behind nothing whatsoever. Real deployments
    # put a JWT-validating participant in front; see AGENTS.md section 8.
    # The `tunnel` profile must NEVER publish these ports: cloudflared may only
    # reach the frontend service.
    ports:
      - "127.0.0.1:6864:6864"   # JSON Ledger API v2
      - "127.0.0.1:6865:6865"   # gRPC Ledger API
    volumes:
      - ledger-state:/var/lib/canton
    healthcheck:
      test: ["CMD", "/usr/local/bin/canton-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      # Cold start is a JVM boot, a synchronizer bootstrap and a seed script.
      # start_period keeps those minutes from counting as failures.
      retries: 5
      start_period: 300s
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined into the bundle at build time, so these are
        # build arguments. NEXT_PUBLIC_LEDGER_ENDPOINT is only a label in the
        # status rail: it names the address a human can actually reach from the
        # browser's machine, not the compose-internal one.
        NEXT_PUBLIC_LEDGER: canton
        NEXT_PUBLIC_LEDGER_ENDPOINT: "localhost:6864 (Canton sandbox in Docker)"
    image: treasury-rfq-frontend
    ports:
      - "127.0.0.1:3000:3000"   # loopback; public reachability is via the tunnel profile
    environment:
      # Read server-side, inside this container: it must address the Canton
      # service by its compose hostname. 127.0.0.1 here would be this
      # container's own loopback and would resolve every party to the fixture.
      LEDGER_JSON_API: http://canton:6864
      NEXT_PUBLIC_LEDGER: canton
      LEDGER_USER_ID: treasury-rfq-ui
      # Public HTTPS origin when the tunnel profile is up (SSR self-fetches +
      # absolute links). Leave unset for loopback-only demos.
      APP_ORIGIN: ${APP_ORIGIN:-}
      # HMAC key for the login session cookie. Pass one through from the host
      # (`SESSION_SECRET=$(openssl rand -base64 48) docker compose up`) to keep
      # users signed in across container restarts. Left empty, the app generates
      # a random secret per container start and logs a warning; never commit a
      # fixed value here, since anyone holding it can forge a treasury session.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Explorer for the settlement's ledger transaction id. Unset in the
      # sandbox, so the id is shown as plain text; DevNet defaults to Lighthouse.
      LEDGER_EXPLORER_URL: ${LEDGER_EXPLORER_URL:-}
    depends_on:
      canton:
        condition: service_healthy

  # Cloudflare Tunnel — UI only. Not part of plain `up`: enable with
  # `--profile tunnel`. Remotely managed: create the tunnel in the Cloudflare
  # dashboard, publish hostname → http://frontend:3000 (compose DNS name, not
  # localhost — cloudflared runs inside this network), then pass TUNNEL_TOKEN.
  # See env/tunnel.example. Never point a published route at canton:6864/6865.
  tunnel:
    image: cloudflare/cloudflared:2026.3.0
    profiles: ["tunnel"]
    restart: unless-stopped
    # Remotely managed: token from the dashboard. Soft default so plain
    # `docker compose up` (no tunnel profile) still interpolates; with
    # `--profile tunnel`, an empty token makes cloudflared exit — set
    # TUNNEL_TOKEN first (env/tunnel.example).
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_started

  # `docker compose run --rm tests`. Not part of `up`: the profile keeps it out.
  tests:
    build:
      context: .
      dockerfile: Dockerfile.canton
      target: dar
    image: treasury-rfq-tests
    profiles: ["tests"]
    # --all --show-coverage, not a bare `dpm test`. The model is a DATA-DEPENDENCY
    # of the test package, so without `--all` the coverage report counts only this
    # package's own templates -- of which there are none -- and prints
    # "0 defined / 0 (100.0%)" for every category. The README quotes 8/8 and 19/19;
    # this is the invocation that produces those numbers. See AGENTS.md section 5.
    command: ["dpm", "test", "--package-root", "daml-test", "--all", "--show-coverage"]

volumes:
  # Named, so `docker compose down` keeps the ledger and `down -v` wipes it.
  ledger-state:
